name: build-libuv
on:
  workflow_dispatch:
    inputs:
      version:
        description: "libuv version"
        required: true
        default: "1.52.1"
      rc:
        description: "rc"
        required: false
        default: ""
      tag_suffix:
        description: "release tag suffix"
        required: true
        default: "-1"
      target:
        description: "build target"
        required: true
        default: "msvc"
        type: choice
        options:
          - msvc

permissions:
  contents: write

jobs:
  build-msvc:
    if: inputs.target == 'msvc' || inputs.target == 'both'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        shell: pwsh
        run: .\scripts\uv-msvc.ps1 -Version ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: libuv-msvc
          path: packages/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [build-msvc]
    if: always() && !failure() && !cancelled()
    steps:
      - name: download msvc artifact
        if: needs.build-msvc.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: libuv-msvc
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: libuv-${{ inputs.version }}${{ inputs.rc != '' && format('-{0}', inputs.rc) || '' }}${{ inputs.tag_suffix }}
          name: libuv-${{ inputs.version }}${{ inputs.rc != '' && format('-{0}', inputs.rc) || '' }}${{ inputs.tag_suffix }}
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: build-openssl-mingw
on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenSSL version"
        required: true
        default: "3.3.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl curl mingw-w64

      - name: build openssl
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          curl -L -o openssl.tar.gz "https://www.openssl.org/source/openssl-${version}.tar.gz"
          tar -xzf openssl.tar.gz
          cd "openssl-${version}"
          ./Configure mingw64 --cross-compile-prefix=x86_64-w64-mingw32- no-shared no-tests --prefix="$PWD/install"
          make -j2
          make install_sw
          cd install
          tar -czf "../openssl-${version}-x64-windows-mingw-static.tar.gz" .
          mv "../openssl-${version}-x64-windows-mingw-static.tar.gz" "$GITHUB_WORKSPACE/"

      - name: upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openssl-mingw-${{ inputs.version }}
          name: openssl-mingw-${{ inputs.version }}
          files: openssl-${{ inputs.version }}-x64-windows-mingw-static.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
